name: Build MPR SQUAD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source ZIP
        run: |
          unzip -q MPR-SQUAD-PCS-WORK-DETAILS-v2.5-multicolor-source.zip -d source

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd source/MPR_SQUAD_Android_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPR-SQUAD-debug-APK
          path: source/MPR_SQUAD_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
