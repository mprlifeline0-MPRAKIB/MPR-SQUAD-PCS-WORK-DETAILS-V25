
name: MPR SQUAD PCS APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'MPR-SQUAD-DAILY-WORK-DETAILS-v4.2-BUILD-READY-SOURCE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          unzip -q MPR-SQUAD-DAILY-WORK-DETAILS-v4.2-BUILD-READY-SOURCE.zip -d /tmp/mpr
          PROJECT_DIR=$(find /tmp/mpr -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. ./

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPR-SQUAD-PCS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
