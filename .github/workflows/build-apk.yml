
name: Build MPR SQUAD PCS v2.9 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MPR-SQUAD-PCS-v2.9-admin-social-links.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o MPR-SQUAD-PCS-v2.9-admin-social-links.zip -d .

      - name: Set app version
        run: |
          sed -i 's/versionName = "2.8"/versionName = "2.9"/' MPR-SQUAD-PCS-v2.9-package/android/app/build.gradle.kts
          sed -i 's/v2.6/v2.9/g' MPR-SQUAD-PCS-v2.9-package/android/app/src/main/assets/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: MPR-SQUAD-PCS-v2.9-package/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPR-SQUAD-PCS-v2.9-debug-apk
          path: MPR-SQUAD-PCS-v2.9-package/android/app/build/outputs/apk/debug/app-debug.apk
