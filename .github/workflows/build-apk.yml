
name: Build MPR SQUAD PCS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MPR-SQUAD-PCS-PATCHED-SOURCE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract patched project
        run: |
          set -e
          unzip -q MPR-SQUAD-PCS-PATCHED-SOURCE.zip -d /tmp/mpr-project
          test -d /tmp/mpr-project/app
          rsync -a --exclude='.github' /tmp/mpr-project/ ./

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPR-SQUAD-PCS-UPDATED-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
