name: Build DWD Daily Work Details v4.4 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DWD-v4.4-SOURCE.zip'
      - 'dwd-completion.js'
      - '.github/workflows/build-dwd-from-zip.yml'

permissions:
  contents: read

concurrency:
  group: dwd-v4.4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract, build and verify DWD v4.4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract the uploaded DWD source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="DWD-v4.4-SOURCE.zip"
          test -s "$ZIP"
          mkdir -p /tmp/dwd-source
          unzip -q "$ZIP" -d /tmp/dwd-source
          test -s /tmp/dwd-source/app/build.gradle.kts
          test -s /tmp/dwd-source/app/src/main/AndroidManifest.xml
          test -s /tmp/dwd-source/app/src/main/java/com/mprlifeline/pcs/MainActivity.kt
          cp -a /tmp/dwd-source/. "$GITHUB_WORKSPACE/"
          echo "DWD v4.4 source ZIP extracted and checked."
      - name: Apply completion features to source
        shell: bash
        run: |
          set -euo pipefail
          cp dwd-completion.js app/src/main/assets/dwd-completion.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ("index.html", "app/src/main/assets/index.html"):
              p=Path(name)
              s=p.read_text(encoding="utf-8")
              if "dwd-completion.js" not in s:
                  parts=s.rsplit("</body>",1)
                  if len(parts)!=2: raise SystemExit(f"Closing body tag missing in {name}")
                  s=parts[0]+'<script src="dwd-completion.js"></script>\n</body>'+parts[1]
              p.write_text(s,encoding="utf-8")
          # Add APK-sharing support with AndroidX FileProvider.
          p=Path("app/build.gradle.kts")
          s=p.read_text(encoding="utf-8")
          if 'androidx.core:core' not in s:
              s += '\n\ndependencies { implementation("androidx.core:core:1.13.1") { exclude(group = "androidx.lifecycle", module = "lifecycle-runtime"); exclude(group = "androidx.profileinstaller", module = "profileinstaller"); exclude(group = "androidx.concurrent", module = "concurrent-futures") } }\n'
              p.write_text(s,encoding="utf-8")
          x=Path("app/src/main/res/xml")
          x.mkdir(parents=True,exist_ok=True)
          (x/"dwd_file_paths.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="shared_apk" path="shared_apk/" />
          </paths>
          ''',encoding="utf-8")
          p=Path("app/src/main/AndroidManifest.xml")
          s=p.read_text(encoding="utf-8")
          provider='''        <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.mprlifeline.pcs.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/dwd_file_paths" />
                  </provider>
          '''
          if "com.mprlifeline.pcs.fileprovider" not in s:
              s=s.replace("</application>",provider+"    </application>")
              p.write_text(s,encoding="utf-8")
          # Use the maintained root Activity source so navigation/scroll fixes
          # are actually included in the APK (the source ZIP may be older).
          root_activity=Path("MainActivity.kt")
          p=Path("app/src/main/java/com/mprlifeline/pcs/MainActivity.kt")
          if root_activity.exists():
              p.write_text(root_activity.read_text(encoding="utf-8"),encoding="utf-8")
          s=p.read_text(encoding="utf-8")
          if "fun shareAppApk()" not in s:
              s=s.replace("import android.widget.Toast","import android.widget.Toast\nimport androidx.core.content.FileProvider\nimport java.io.File")
              needle="        @JavascriptInterface fun printHtml(html: String) {"
              bridge='''        @JavascriptInterface fun shareAppApk() {
                      runOnUiThread {
                          try {
                              val source = File(applicationInfo.sourceDir)
                              val dir = File(cacheDir, "shared_apk").apply { mkdirs() }
                              val apk = File(dir, "DWD-Daily-Work-Details-v4.4.apk")
                              source.inputStream().use { input -> apk.outputStream().use { output -> input.copyTo(output) } }
                              val uri = FileProvider.getUriForFile(this@MainActivity, "com.mprlifeline.pcs.fileprovider", apk)
                              val send = Intent(Intent.ACTION_SEND).apply {
                                  type = "application/vnd.android.package-archive"
                                  putExtra(Intent.EXTRA_STREAM, uri)
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              }
                              startActivity(Intent.createChooser(send, "DWD অ্যাপটি অন্যকে পাঠান"))
                          } catch (e: Exception) {
                              Toast.makeText(this@MainActivity, "APK Share করা যায়নি: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }

          '''
              if needle not in s: raise SystemExit("Could not locate Android share bridge insertion point")
              s=s.replace(needle,bridge+needle)
              p.write_text(s,encoding="utf-8")
          # Patch the HTML database initializer and Android WebView scroll settings.
          old = '''let db=JSON.parse(localStorage.getItem(KEY)||'{"duties":[],"bills":[],"people":[],"pay":[],"custom":[],"stockNotes":[]}');'''
          new = '''let db;
          const DWD_DEFAULT_DB={duties:[],bills:[],people:[],pay:[],custom:[],stockNotes:[]};
          try {
            const raw=localStorage.getItem(KEY);
            const parsed=raw?JSON.parse(raw):DWD_DEFAULT_DB;
            if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)) throw new Error('invalid database');
            for(const k of ['duties','bills','people','pay','custom','stockNotes']) {
              if(parsed[k]===undefined) parsed[k]=[];
              if(!Array.isArray(parsed[k])) throw new Error('invalid '+k);
            }
            db=parsed;
          } catch(err) {
            try { const raw=localStorage.getItem(KEY); if(raw) localStorage.setItem(KEY+'_recovery_'+Date.now(),raw); localStorage.setItem(KEY,JSON.stringify(DWD_DEFAULT_DB)); } catch(storageErr) {}
            db={...DWD_DEFAULT_DB};
            window.addEventListener('load',()=>setTimeout(()=>alert('আগের সংরক্ষিত তথ্যের ফাইলে সমস্যা পাওয়া গেছে। Recovery কপি রাখা হয়েছে।'),400));
          }'''
          for name in ('index.html','app/src/main/assets/index.html'):
              p=Path(name)
              if p.exists():
                  html=p.read_text(encoding='utf-8')
                  if old in html: p.write_text(html.replace(old,new,1),encoding='utf-8')
                  elif 'DWD_DEFAULT_DB' not in html: raise SystemExit('Database initializer not found in '+name)
          p=Path('app/src/main/java/com/mprlifeline/pcs/MainActivity.kt')
          kotlin=p.read_text(encoding='utf-8')
          needle='        web.settings.javaScriptEnabled = true'
          if 'web.isVerticalScrollBarEnabled = true' not in kotlin and needle in kotlin:
              kotlin=kotlin.replace(needle,needle+'\n        web.isVerticalScrollBarEnabled = true\n        web.overScrollMode = android.view.View.OVER_SCROLL_IF_CONTENT_SCROLLS')
              p.write_text(kotlin,encoding='utf-8')
          # Expose the native Android share sheet for JSON/text backups.
          if "fun shareText(" not in s:
              needle="        @JavascriptInterface fun printHtml(html: String) {"
              bridge='''        @JavascriptInterface fun shareText(title: String, content: String) {
                      runOnUiThread {
                          try {
                              val send = Intent(Intent.ACTION_SEND).apply {
                                  type = "text/plain"
                                  putExtra(Intent.EXTRA_SUBJECT, title)
                                  putExtra(Intent.EXTRA_TEXT, content)
                              }
                              startActivity(Intent.createChooser(send, "হিসাবের ব্যাকআপ Share করুন"))
                          } catch (e: Exception) {
                              Toast.makeText(this@MainActivity, "ব্যাকআপ Share করা যায়নি: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }

              '''
              if needle not in s: raise SystemExit("Could not locate text-share bridge insertion point")
              s=s.replace(needle,bridge+needle)
              p.write_text(s,encoding="utf-8")
      - name: Verify app identity and launcher icons
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 44' app/build.gradle.kts
          grep -q 'versionName = "4.4"' app/build.gradle.kts
          grep -q 'applicationId = "com.mprlifeline.pcs"' app/build.gradle.kts
          grep -q 'DWD – Daily Work Details' app/src/main/AndroidManifest.xml
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-${density}/ic_launcher.png"
            test -s "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check dwd-completion.js
          python3 - <<'PYCODE'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.active = True
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.active = False
              def handle_data(self, data):
                  if self.active:
                      self.parts.append(data)
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          Path("/tmp/dwd-inline.js").write_text("\n".join(parser.parts), encoding="utf-8")
          if not parser.parts:
              raise SystemExit("No inline JavaScript found in index.html")
          PYCODE
          node --check /tmp/dwd-inline.js

      - name: Audit extracted app structure and data flows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter
          import re, json
          html=Path("index.html").read_text(encoding="utf-8")
          js=Path("app.js").read_text(encoding="utf-8")
          extra=Path("dwd-completion.js").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.scripts=[]; self.forms=[]; self.current_form=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if "id" in a: self.ids.append(a["id"])
                  if tag=="script": self.scripts.append(a.get("src","[inline]"))
                  if tag=="form":
                      self.current_form={"id":a.get("id","(no id)"),"fields":[]}; self.forms.append(self.current_form)
                  if self.current_form and tag in ("input","select","textarea","button"):
                      self.current_form["fields"].append({"tag":tag,"id":a.get("id"),"name":a.get("name"),"type":a.get("type")})
              def handle_endtag(self,tag):
                  if tag=="form": self.current_form=None
          p=Audit(); p.feed(html)
          dup=[k for k,v in Counter(p.ids).items() if v>1]
          ids=set(p.ids)
          refs=set(re.findall(r"""(?:getElementById\s*\(\s*|querySelector\s*\(\s*['"]#)([A-Za-z][\w:-]*)""",js+"\n"+extra))
          missing=sorted(x for x in refs-ids if not x.startswith("dwd"))
          funcs=sorted(set(re.findall(r"(?:function\s+|(?:window\.)?)([A-Za-z_$][\w$]*)\s*=\s*function|function\s+([A-Za-z_$][\w$]*)\s*\(",js)))
          funcs=[a or b for a,b in funcs]
          checks={
            "root_index_html":Path("index.html").is_file(),
            "app_js":Path("app.js").is_file(),
            "completion_js":Path("dwd-completion.js").is_file(),
            "database_key_present":bool(re.search(r"localStorage\.(?:getItem|setItem)\s*\(\s*KEY",js)),
            "database_save_function":bool(re.search(r"function\s+save\s*\(|(?:const|let|var)\s+save\s*=",js)),
            "backup_restore_hooks":bool(re.search(r"function\s+restore\s*\(|(?:window\.)?restore\s*=",js)),
            "pdf_or_print_hooks":bool(re.search(r"printHtml|jsPDF|window\.print",js+"\n"+extra)),
            "android_back_hook": "appBackFromAndroid" in extra,
            "vertical_scroll_css":bool(re.search(r"overflow-y\s*:\s*(?:auto|scroll)",html+"\n"+extra)),
          }
          lines=["DWD SOURCE AUDIT — generated in GitHub Actions","",f"HTML IDs: {len(p.ids)}",f"Duplicate IDs: {', '.join(dup) if dup else 'none'}",f"Forms found: {len(p.forms)}",f"Script load order: {' -> '.join(p.scripts)}","", "CHECKS:"]
          lines += [f"- {'PASS' if v else 'REVIEW'}: {k}" for k,v in checks.items()]
          lines += ["", "FORM INVENTORY:"]
          for form in p.forms:
              lines.append(f"- {form['id']}: {len(form['fields'])} controls")
              for field in form["fields"]:
                  lines.append(f"  • {field['tag']} id={field['id']} name={field['name']} type={field['type']}")
          lines += ["", "POTENTIAL STATIC ISSUES:"]
          lines.append("- Duplicate HTML IDs: "+(", ".join(dup) if dup else "none detected"))
          lines.append("- Selector IDs not found in static HTML: "+(", ".join(missing) if missing else "none detected; dynamically created IDs are not exhaustively validated"))
          lines += ["", "LIMITATION: Static source audit only. It does not prove runtime navigation, calculations, persistence, restore, PDF rendering, or Android device behavior."]
          Path("DWD-SOURCE-AUDIT-BN.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
          print("\n".join(lines))
          if dup: raise SystemExit("Duplicate HTML IDs detected")
          PY
      - name: Upload source audit report
        uses: actions/upload-artifact@v4
        with:
          name: DWD-v4.4-source-audit
          path: DWD-SOURCE-AUDIT-BN.txt
          if-no-files-found: error
          retention-days: 30

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Confirm APK exists and prepare download
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" "release/DWD-Daily-Work-Details-v4.4-debug.apk"
          sha256sum "release/DWD-Daily-Work-Details-v4.4-debug.apk" | tee release/SHA256SUMS.txt
          cat > release/BUILD-RESULT-BN.txt <<'EOF'
          DWD v4.4 APK Build সফল।
          APK ফাইল: DWD-Daily-Work-Details-v4.4-debug.apk
          এই APK GitHub Actions Artifact থেকে ডাউনলোড করুন।
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DWD-Daily-Work-Details-v4.4-APK
          path: |
            release/DWD-Daily-Work-Details-v4.4-debug.apk
            release/SHA256SUMS.txt
            release/BUILD-RESULT-BN.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
